<script src="story-styles/cscape-story.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        window.CSCAPE_STORY_API.init();

        await Reveal.initialize({
            hash: false,
            controls: false,
            progress: false,
            transition: "none",
            center: false,

            keyboard: false,
            touch: false,
            mouseWheel: false,

            plugins: [
                RevealCscape
            ]
        });

        const LOCAL_STATUS_URL = "http://127.0.0.1:5001/status";
        const POLL_INTERVAL_MS = 3000;

        let advancing = false;
        let pollInProgress = false;

        async function fetchJavaStatus() {
            const separator = LOCAL_STATUS_URL.includes("?") ? "&" : "?";

            const response = await fetch(
                LOCAL_STATUS_URL + separator + "cachebust=" + Date.now(),
                {
                    cache: "no-store",
                    headers: {
                        "Cache-Control": "no-cache"
                    }
                }
            );

            if (!response.ok) {
                throw new Error(
                    `Status-Bridge antwortet mit HTTP ${response.status}`
                );
            }

            const status = await response.json();

            if (!status || typeof status !== "object") {
                throw new Error(
                    "Status-Bridge lieferte kein JSON-Objekt."
                );
            }

            return status;
        }

        async function checkCurrentTask() {
            if (advancing || pollInProgress) {
                return;
            }

            const currentSlide = Reveal.getCurrentSlide();
            const waitKey = currentSlide?.dataset?.waitKey;

            if (!waitKey) {
                return;
            }

            pollInProgress = true;

            try {
                const status = await fetchJavaStatus();

                if (status[waitKey] === true) {
                    advancing = true;

                    window.setTimeout(() => {
                        Reveal.next();
                    }, 700);
                }
            } catch (error) {

                console.warn(
                    "[JavaScape] Aufgabenprüfung fehlgeschlagen:",
                    error.message
                );
            } finally {
                pollInProgress = false;
            }
        }

        Reveal.on("slidechanged", () => {
            advancing = false;
            window.setTimeout(checkCurrentTask, 500);
        });

        window.setTimeout(checkCurrentTask, 700);
        window.setInterval(checkCurrentTask, POLL_INTERVAL_MS);


        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                alert("Close with Ctrl+W");
            }
        });
    });
</script>
