        body.theme-coffee {
            --page-bg: #18110c;
            --font-main: system-ui, sans-serif;
            --font-display: Georgia, serif;
            --scene-bg-url: url("pics/background.jpeg");
            --scene-overlay: linear-gradient(
                    90deg,
                    rgba(18, 10, 5, 0.22),
                    rgba(18, 10, 5, 0.05) 48%,
                    rgba(18, 10, 5, 0.26)
            );
            --scene-vignette: radial-gradient(
                    circle at center,
                    transparent 48%,
                    rgba(18, 9, 4, 0.56)
            );

            --speaker-x: 3vw;
            --speaker-bottom: 24vh;
            --speaker-width: min(24vw, 320px);
            --speaker-bg: rgba(52, 31, 19, 0.94);
            --speaker-border: #d6a86e;
            --speaker-border-right: #f1d4a8;
            --speaker-radius: 20px;
            --speaker-shadow: 0 20px 60px rgba(0, 0, 0, 0.58);

            --dialogue-left: 3vw;
            --dialogue-right: 3vw;
            --dialogue-bottom: 3vh;
            --dialogue-min-height: 18vh;
            --dialogue-max-height: 38vh;
            --dialogue-bg: rgba(37, 23, 15, 0.96);
            --dialogue-border: rgba(214, 168, 110, 0.72);
            --dialogue-radius: 20px;
            --dialogue-shadow: 0 20px 58px rgba(0, 0, 0, 0.52);

            --name-color: #f3c77f;
            --text-color: #fff7e9;
            --objective-color: #f3c77f;
            --task-bg: rgba(255, 247, 233, 0.10);
            --task-border: rgba(243, 199, 127, 0.72);
            --task-color: #fff7e9;

            --name-size: clamp(0.76rem, 1.1vw, 1rem);
            --text-size: clamp(0.95rem, 1.42vw, 1.3rem);
            --task-size: clamp(0.72rem, 1.08vw, 1rem);
        }

        body.theme-coffee .text {
            line-height: 1.45;
        }

        body.theme-coffee .task {
            margin-top: 0.8rem;
            padding: 0.75rem 0.9rem;
            border-width: 1px;
            border-style: solid;
            border-radius: 12px;
            line-height: 1.35;
            font-weight: 650;
        }

        body.theme-coffee .task:empty {
            display: none !important;
        }

        body.theme-coffee .audio-hint {
            background: rgba(37, 23, 15, 0.96);
            color: #fff7e9;
            border-color: #d6a86e;
